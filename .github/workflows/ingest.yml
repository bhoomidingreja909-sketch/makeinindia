name: Daily Invest India ingest
on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST, once a day
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INGEST_CONTACT: ${{ secrets.INGEST_CONTACT }}
